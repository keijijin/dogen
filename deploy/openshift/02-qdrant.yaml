apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  labels:
    app.kubernetes.io/name: dogen-qdrant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: dogen-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dogen-qdrant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dogen-qdrant
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.13.5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
            - name: snapshots
              mountPath: /qdrant/snapshots
          readinessProbe:
            tcpSocket:
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
        - name: snapshots
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: dogen-qdrant
spec:
  selector:
    app.kubernetes.io/name: dogen-qdrant
  ports:
    - port: 6333
      targetPort: 6333
