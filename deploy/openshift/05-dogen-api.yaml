apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogen-api
  labels:
    app.kubernetes.io/name: dogen-api
  annotations:
    dogen.jp/after-apply: このマニフェストを apply すると QUARKUS_PROFILE が compose のみに戻る。OIDC 利用中は ./09-configure-oidc.sh を再実行。
    image.openshift.io/triggers: |-
      [
        {
          "from": {"kind":"ImageStreamTag","name":"dogen-api:latest"},
          "fieldPath": "spec.template.spec.containers[?(@.name==\"quarkus\")].image"
        }
      ]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dogen-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dogen-api
    spec:
      containers:
        - name: quarkus
          image: dogen-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: QUARKUS_PROFILE
              value: compose
            - name: JDBC_URL
              value: jdbc:postgresql://postgres:5432/dogen_app
            - name: JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: dogen-secrets
                  key: POSTGRES_USER
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dogen-secrets
                  key: POSTGRES_PASSWORD
            - name: LLAMA_STACK_URL
              value: http://llama-stack:8321
            - name: DOGEN_CHAT_DEFAULT_MODEL
              value: openai/gpt-4o-mini
            - name: DOGEN_CHAT_UPSTREAM_AUTHORIZATION
              value: Bearer fake
            - name: DOGEN_CHAT_WEB_SEARCH_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dogen-api
  labels:
    app.kubernetes.io/name: dogen-api
spec:
  selector:
    app.kubernetes.io/name: dogen-api
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dogen-api
  labels:
    app.kubernetes.io/name: dogen-api
spec:
  to:
    kind: Service
    name: dogen-api
    weight: 100
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
