<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン処理 — 正法眼蔵読解</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="prose" style="padding: 2rem; max-width: 36rem; margin: 0 auto">
    <p id="msg">ログインを処理しています…</p>
    <p style="font-size: 0.85rem; color: var(--ink-muted)">
      このまま数秒たっても進まない場合は、IdP のリダイレクト URI や CORS 設定を確認してください。
    </p>
    <script src="../js/oidc-config.js"></script>
    <script src="../js/oidc-pkce.js"></script>
    <script>
      (function () {
        var msg = document.getElementById("msg");
        if (!window.DogenOidc || !window.DogenOidc.isEnabled()) {
          msg.textContent = "OIDC が無効です。web/js/oidc-config.js の enabled / authority / client_id を確認してください。";
          return;
        }
        window.DogenOidc.completeLoginFromCurrentUrl()
          .then(function (next) {
            window.location.replace(next || "/");
          })
          .catch(function (e) {
            msg.textContent = e.message || String(e);
          });
      })();
    </script>
  </body>
</html>
