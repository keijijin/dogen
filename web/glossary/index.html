        <h1>用語辞典</h1>
        <p>頻出語を横断的に説明するページです。現在はサンプル項目のみです。</p>

        <h2>さ</h2>
        <dl>
          <dt id="soku">即（卽）</dt>
          <dd>「すなわち一致する」「離れず即している」など、中道や相即を表す接辞として多用されます。</dd>
        </dl>

        <h2>し</h2>
        <dl>
          <dt id="shusho">修証</dt>
          <dd>修行と悟りを切り離さずに論じる語。悟りだけ先にある、とも修行だけが実、とも片づけにくい箇所で繰り返し出ます。</dd>
        </dl>

        <h2>ま</h2>
        <dl>
          <dt>迷悟</dt>
          <dd>迷いとさとりの対語。対立を超えて論じられることが多いです。</dd>
        </dl>
