<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-labelledby="kt kd">
  <title id="kt">谿聲山色：学習用スケッチ</title>
  <desc id="kd">第二十五巻：蘇軾の偈から道元の問い、後半の因縁へつなぐ骨格図。</desc>

  <rect width="700" height="200" fill="#f7f4ed" />

  <text x="350" y="24" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="14" fill="#1a1a18">谿聲山色 — 学習スケッチ</text>

  <rect x="20" y="44" width="200" height="100" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="120" y="72" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">蘇軾（東坡居士）</text>
  <text x="120" y="92" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">谿聲は広長舌相</text>
  <text x="120" y="112" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">山色は清浄身相</text>
  <text x="120" y="132" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">他日如何挙似人</text>

  <path d="M220 94 L270 94" stroke="#6b5344" stroke-width="2" marker-end="url(#km)" />

  <rect x="270" y="44" width="200" height="100" rx="6" fill="#fdfcfa" stroke="#6b5344" />
  <text x="370" y="72" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">道元の問い</text>
  <text x="370" y="94" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">居士か山水か、の眼目</text>
  <text x="370" y="114" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">美談へ畳まない</text>
  <text x="370" y="134" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">語順と反転に従う</text>

  <path d="M470 94 L520 94" stroke="#6b5344" stroke-width="2" marker-end="url(#km)" />

  <rect x="520" y="44" width="160" height="100" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="600" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">後半の因縁</text>
  <text x="600" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">香厳（撃竹）など</text>
  <text x="600" y="124" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">見聞を仏法として読む</text>

  <defs>
    <marker id="km" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6b5344" />
    </marker>
  </defs>
</svg>
