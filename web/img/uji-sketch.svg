<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-labelledby="ut ud">
  <title id="ut">有時：学習用スケッチ</title>
  <desc id="ud">第二巻「有時」：三身・透脱・有於有時の骨格を、本文に戻るためのメモ図。</desc>
  <rect width="680" height="220" fill="#f7f4ed" />
  <text x="340" y="26" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="14" fill="#1a1a18">有時 — 学習スケッチ</text>

  <rect x="24" y="48" width="200" height="88" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="124" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">三身</text>
  <text x="124" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">法身・報身・化身の言い回し</text>
  <text x="124" y="120" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">本文の定義に従う</text>

  <path d="M224 92 L280 92" stroke="#6b5344" stroke-width="2" marker-end="url(#um)" />

  <rect x="280" y="48" width="200" height="88" rx="6" fill="#fdfcfa" stroke="#6b5344" />
  <text x="380" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">透脱自在</text>
  <text x="380" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">有時に即して語る</text>
  <text x="380" y="120" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">二元の外に逃げない</text>

  <path d="M480 92 L536 92" stroke="#6b5344" stroke-width="2" marker-end="url(#um)" />

  <rect x="536" y="48" width="120" height="88" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="596" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">有於</text>
  <text x="596" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">有時</text>
  <text x="596" y="120" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">時の在り方</text>

  <text x="24" y="168" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">
    用語の辞書定義より、道元の文脈での「有時」「透脱」を優先して読む。
  </text>

  <defs>
    <marker id="um" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6b5344" />
    </marker>
  </defs>
</svg>
