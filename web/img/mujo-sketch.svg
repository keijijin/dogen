<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="mjt mjd">
  <title id="mjt">無情説法：学習用スケッチ</title>
  <desc id="mjd">草木国土が説法するという言い回しを、擬人化や比喩の取り違えにしないためのメモ図。</desc>
  <rect width="100%" height="100%" fill="#f7fafc" />
  <text x="340" y="26" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="15" fill="#1a202c">無情説法 — 学習スケッチ</text>
  <path d="M60 160 Q120 60 200 120 T340 100 T520 130 T620 90" fill="none" stroke="#3182ce" stroke-width="2.5" />
  <text x="130" y="185" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#2b6cb0">山河大地</text>
  <rect x="420" y="70" width="90" height="56" rx="6" fill="#fff" stroke="#2f855a" stroke-width="2" />
  <text x="465" y="98" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="12" fill="#276749">仏法</text>
  <text x="465" y="116" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a5568">説く</text>
  <text x="340" y="205" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="12" fill="#2d3748">擬人ではなく、本文の語順と用例に沿って読む。</text>
</svg>
