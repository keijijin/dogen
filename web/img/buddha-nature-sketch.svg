<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="bt bd">
  <title id="bt">佛性：悉有と時節因緣</title>
  <desc id="bd">釈尊の「一切衆生悉有佛性」から、道元の悉有・時節因緣・若至の読みへつなぐ骨格図。</desc>

  <rect width="640" height="200" fill="#f7f4ed" />

  <text x="320" y="26" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="14" fill="#1a1a18">佛性：悉有 と 時節因緣</text>

  <rect x="40" y="50" width="160" height="72" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="120" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">釈尊</text>
  <text x="120" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">一切衆生悉有佛性</text>

  <path d="M200 86 L260 86" stroke="#6b5344" stroke-width="2" marker-end="url(#m)" />

  <rect x="260" y="50" width="160" height="72" rx="6" fill="#fdfcfa" stroke="#6b5344" />
  <text x="340" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">悉有（道元の読み）</text>
  <text x="340" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">単純な有無へ還元しない</text>

  <path d="M420 86 L480 86" stroke="#6b5344" stroke-width="2" marker-end="url(#m)" />

  <rect x="480" y="50" width="120" height="72" rx="6" fill="#ebe6dc" stroke="#6b5344" />
  <text x="540" y="78" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="11" fill="#1a1a18">時節因緣</text>
  <text x="540" y="100" text-anchor="middle" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">若至（先送り批判）</text>

  <text x="40" y="150" font-family="Hiragino Sans,Yu Gothic UI,Yu Gothic,Meiryo,sans-serif" font-size="10" fill="#4a4844">語の辞書義に固定せず、本文の用例で「悉有」「若至」を追う。</text>

  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#6b5344" />
    </marker>
  </defs>
</svg>
